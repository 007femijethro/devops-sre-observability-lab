name: sre-observability-lab
services:
  prometheus:
    image: prom/prometheus:v3.3.1
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=7d']
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes: ['./alertmanager:/etc/alertmanager:ro']
    ports: ['127.0.0.1:9093:9093']
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes: ['./blackbox:/etc/blackbox:ro']
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ['--path.rootfs=/host']
    pid: host
    volumes: ['/:/host:ro,rslave']
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.52.1
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped
  loki:
    image: grafana/loki:3.4.2
    command: ['-config.file=/etc/loki/config.yaml']
    volumes: ['./loki:/etc/loki:ro','loki_data:/loki']
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.8.3
    command: ['run','/etc/alloy/config.alloy']
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
